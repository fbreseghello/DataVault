name: release

# Pushing a tag like v1.2.3 builds every target and publishes a GitHub Release
# with the binaries, SHA256SUMS and the matching CHANGELOG section.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          npm --prefix web ci
          npm --prefix web run check
          go vet ./...
          go test ./...

      - name: Build
        # The build script rejects tags that are not valid semantic versions.
        run: go run ./scripts/build -release -version "${GITHUB_REF_NAME}"

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "[") != 1 { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $prerelease
