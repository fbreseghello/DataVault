<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="400" height="600">
  <!-- A stand-in until the Midjourney illustrations arrive (docs/HOLLOW-ARTE.md):
       a hooded figure with a lantern on a bare rise, in greys on a dark ground, so
       it goes through the same theme toning as the real art. -->
  <rect width="200" height="300" fill="#0b0b0b"/>
  <!-- a pale moon and the bare rise -->
  <circle cx="148" cy="62" r="18" fill="#3a3a3a"/>
  <path d="M0 262 Q60 236 120 246 T200 240 V300 H0 Z" fill="#262626"/>
  <path d="M0 262 Q60 236 120 246 T200 240" fill="none" stroke="#000" stroke-width="2"/>
  <!-- the staff -->
  <path d="M56 70 L64 256" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <path d="M56 70 L64 256" stroke="#6a6a6a" stroke-width="3" stroke-linecap="round"/>
  <!-- the cloak, falling to the ground -->
  <path d="M100 74 C82 82 74 110 72 150 C70 190 62 230 52 256 L150 256 C140 222 136 182 134 142 C132 104 122 80 100 74 Z"
        fill="#7a7a7a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- the light side of the cloak -->
  <path d="M112 82 C126 96 130 130 132 168 C134 206 140 232 150 256 L118 256 C120 214 120 160 112 82 Z" fill="#a9a9a9"/>
  <!-- folds -->
  <path d="M96 120 C94 170 88 214 82 254 M110 130 C110 180 106 222 104 254" fill="none" stroke="#000" stroke-width="2"/>
  <!-- the hood, open to the left, the face in shadow -->
  <path d="M98 40 C76 42 66 62 70 84 C74 98 86 104 100 102 C116 100 124 84 122 66 C120 50 112 40 98 40 Z"
        fill="#8c8c8c" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 62 C76 74 80 90 92 94 C100 96 104 86 102 76 C100 64 90 56 78 62 Z" fill="#1a1a1a"/>
  <circle cx="86" cy="74" r="1.8" fill="#d8d8d8"/>
  <!-- the arm raising the lantern -->
  <path d="M96 112 C84 108 70 98 62 86" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/>
  <path d="M96 112 C84 108 70 98 62 86" fill="none" stroke="#7a7a7a" stroke-width="7" stroke-linecap="round"/>
  <!-- the lantern, the brightest thing in the picture -->
  <path d="M50 56 L64 56" stroke="#000" stroke-width="3"/>
  <rect x="47" y="58" width="20" height="26" rx="2" fill="#efefef" stroke="#000" stroke-width="3"/>
  <path d="M57 62 L60 70 L57 78 L54 70 Z" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  <path d="M47 71 H67 M57 58 V84" stroke="#000" stroke-width="1.5"/>
</svg>
